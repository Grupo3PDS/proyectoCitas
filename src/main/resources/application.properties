# Configuración de base de datos H2 (por defecto para desarrollo local)
# En Docker, estas variables se sobrescriben para usar MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./medicronos}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.database-platform=${SPRING_JPA_PLATFORM:org.hibernate.dialect.H2Dialect}

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA: update crea tablas si no existen y las actualiza si cambian
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Inicialización SQL: se ejecuta DESPUÉS de que JPA crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sql/data.sql
# Permite que INSERT duplicados no rompan el arranque
spring.sql.init.continue-on-error=true

# Puerto alternativo para el servidor web
server.port=8085
